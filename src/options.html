<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailToWith - Options</title>
  <style>
  :root {
    --background: #E7F0FF;
    --primary: #5B4DB5;
    --primary-hover: #49379B;
    --accent: #E0218A;
    --card-bg: #FFFFFF;
    --border: #D4D7F5;
    --text-dark: #333333;
    --text-muted: #6C6C80;
    --radius: 10px;
    --shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
    --font: 'JetBrains Mono', 'Inter', monospace;
  }

  body {
    font-family: var(--font);
    background-color: var(--background);
    color: var(--text-dark);
    margin: 0;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header img {
    width: 64px;
    height: 64px;
    margin-bottom: 8px;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.1));
  }

  header h1 {
    margin: 0;
    font-weight: 700;
    font-size: 22px;
  }

  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  #newProfileForm {
    max-width: 400px;
    width: 100%;
    background: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 30px;
  }

  input[type=text] {
    background: white;
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text-dark);
  }

  button {
    font-family: var(--font);
    font-weight: 600;
    font-size: 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.25s ease;
  }

  #addProfileBtn {
    background-color: var(--primary);
    color: white;
    padding: 12px;
    border: none;
    width: 100%;
    letter-spacing: 0.02em;
    box-shadow: var(--shadow);
  }

  #addProfileBtn:hover {
    background-color: var(--primary-hover);
  }

  #restoreBtn {
    background: transparent;
    border: 2px solid var(--primary);
    color: var(--primary);
    margin-top: 30px;
    padding: 10px 16px;
    box-shadow: none;
  }

  #restoreBtn:hover {
    background-color: rgba(91,77,181,0.1);
  }

  #profilesContainer {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    justify-items: center;
    margin-top: 20px;
    width: 100%;
    max-width: 900px;
  }

  .profile-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    width: 260px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    text-align: left;
  }

  .profile-header {
    font-weight: 700;
    color: var(--text-dark);
    font-size: 16px;
  }

  .template-field {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.4;
    word-break: break-all;
  }

  .profile-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }

  .profile-actions button {
    flex: 1;
    padding: 8px 10px;
    border: none;
  }

  .profile-actions .edit-btn {
    background-color: var(--primary);
    color: white;
  }

  .profile-actions .edit-btn:hover {
    background-color: var(--primary-hover);
  }

  .profile-actions .delete-btn {
    background-color: var(--accent);
    color: white;
  }

  .profile-actions .delete-btn:hover {
    background-color: #be166b;
  }

    h1 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 20px;
    }

    #profilesContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .profile-header {
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .template-field {
      font-size: 13px;
      color: var(--text-light);
      word-break: break-all;
    }

    .profile-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background 0.25s ease;
      box-shadow: var(--shadow);
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button.danger {
      background: #d9534f;
    }

    button.secondary {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    button.secondary:hover {
      background-color: rgba(91,77,181,0.1);
    }

    #addProfileBtn, #restoreBtn {
      margin: 20px 5px;
      padding: 10px 16px;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin: 10px 0;
    }

    input[type=text] {
      flex: 1;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    #newProfileForm {
      text-align: center;
      margin-bottom: 20px;
    }

  /* Add New Profile card styling */
  .add-card {
    background-color: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(91, 77, 181, 0.2);
    color: var(--primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: 200px;
    cursor: pointer;
    transition: all 0.25s ease;
    font-weight: bold;
  }
  .add-card:hover {
    background-color: rgba(255,255,255,0.3);
    border-color: rgba(91, 77, 181, 0.4);
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }
  .add-card img {
    width: 48px;
    height: 48px;
    opacity: 0.8;
  }
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1001;
  }

  /* Background blur layer - separate from modal content */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 1000;
  }

  .modal.hidden {
    display: none;
  }
  
  .modal-backdrop.hidden {
    display: none;
  }

  .modal-content {
    position: relative;
    z-index: 1001;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  </style>
 </head>
 <body>
   <header>
     <img src="../assets/icon128.png" alt="MailToWith" />
     <h1>MailToWith</h1>
     <p>MailTo Links PowerUp</p>
   </header>

<main id="profilesContainer" class="profiles-container" role="main" aria-label="User Profiles">
   <!-- Dynamic profile cards will be inserted here by JavaScript -->
   </main>

   <button id="restoreBtn" class="restore-btn">Restore defaults</button>

   <!-- Profile Editor Modal -->
   <div id="profileModal" class="modal hidden">
     <div class="modal-content">
       <h2>Profile Editor</h2>
       <div class="modal-field">
         <label for="modalProfileName">Profile Name</label>
         <input type="text" id="modalProfileName" placeholder="Profile Name" />
       </div>

       <div class="modal-field">
         <label for="modalProfileTemplate">Template</label>
         <textarea id="modalProfileTemplate" placeholder="Template URL"></textarea>
       </div>

       <div class="modal-hint">
         <p class="hint-title">Available Placeholder Tags:</p>
         <div class="hint-tags">
           <p>Email Address : <code>{{to}}</code></p>
           <p>Email Subject : <code>{{subject}}</code></p>
           <p>Message Body : <code>{{body}}</code></p>
         </div>
         <p class="hint-description">These placeholders can be used within your template URL to insert dynamic email data automatically.</p>
       </div>

       <div class="modal-actions">
         <button id="saveProfileBtn" class="primary">Save</button>
         <button id="cancelModalBtn" class="secondary">Cancel</button>
       </div>
     </div>
   </div>

   <style>
     .modal-content {
       max-width: 440px;
       width: 90%;
       box-sizing: border-box;
       padding: 24px;
       background: rgba(255, 255, 255, 0.95);
       border-radius: 10px;
       display: flex;
       flex-direction: column;
       align-items: stretch;
       gap: 14px;
     }

     .modal-field {
       display: flex;
       flex-direction: column;
       margin-bottom: 10px;
     }

     .modal-field label {
       font-weight: 600;
       margin-bottom: 6px;
     }

     .modal-field input,
     .modal-field textarea {
       width: 100%;
       padding: 10px 12px;
       border: 1px solid #ccc;
       border-radius: 6px;
       font-size: 14px;
       resize: vertical;
       box-sizing: border-box;
     }

     .modal-hint {
       background: rgba(240, 240, 255, 0.9);
       border-left: 4px solid #5E529E;
       border-radius: 6px;
       padding: 12px 16px;
       margin-top: 6px;
       margin-bottom: 18px;
       font-size: 13px;
       line-height: 1.5;
     }

     .modal-hint .hint-title {
       font-weight: 600;
       margin-bottom: 6px;
     }

     .modal-hint .hint-tags p {
       margin: 3px 0;
       color: #333;
     }

     .modal-hint code {
       background: #e5e5f7;
       padding: 1px 6px;
       border-radius: 4px;
       font-family: monospace;
       color: #333;
     }

     .modal-hint .hint-description {
       margin-top: 8px;
       font-size: 12px;
       color: #555;
     }

     @media (max-width: 480px) {
       .modal-content {
         padding: 16px;
         max-width: 95%;
       }
     }
   </style>
   
   <!-- Separate backdrop element for selective blur -->
   <div id="modalBackdrop" class="modal-backdrop hidden"></div>

   <script src="options.js"></script>
 </body>
 </html>
