<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Preview - MailToWith</title>
  <link rel="icon" href="../assets/icon48.png" />

  <style>
    /* === CSS Variables === */
    :root {
      --background: #E7F0FF;
      --primary: #5B4DB5;
      --primary-hover: #49379B;
      --text-dark: #333333;
      --text-muted: #6C6C80;
      --border: #DCE3F0;
      --radius: 10px;
      --font: 'JetBrains Mono', 'Inter', sans-serif;
      --shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* === Base Layout === */
    * { box-sizing: border-box; }

    body {
      background-color: var(--background);
      margin: 0;
      padding: 16px;
      height: 100vh;
      font-family: var(--font);
      color: var(--text-dark);
      display: flex;
    }

    .compose {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      width: 100%;
      overflow: hidden;
    }

    /* === Title bar === */
    .compose-header {
      background: var(--primary);
      color: #fff;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .compose-header .badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      opacity: 0.85;
    }

    /* === Header fields === */
    .fields {
      padding: 4px 16px;
      border-bottom: 1px solid var(--border);
    }

    .field {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .field:last-child { border-bottom: none; }
    .field.hidden { display: none; }

    .field-label {
      color: var(--text-muted);
      min-width: 42px;
      padding-top: 3px;
      font-size: 12px;
    }

    .field-value {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .field-value.subject {
      font-weight: 700;
      font-size: 14px;
      padding-top: 2px;
      word-break: break-word;
    }

    /* === Address chips === */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F1F4FB;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px 3px 3px;
      max-width: 100%;
    }

    .chip .avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .chip .chip-name {
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip .chip-email {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-value {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      padding-top: 3px;
    }

    /* === Body === */
    .body-view {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-size: 13px;
      line-height: 1.55;
      word-wrap: break-word;
    }

    .body-view.plain {
      white-space: pre-wrap;
      font-family: var(--font);
    }

    .body-view img { max-width: 100%; }
    .body-view a { color: var(--primary); }
    .body-view table { border-collapse: collapse; }
    .body-view td, .body-view th { border: 1px solid var(--border); padding: 4px 8px; }
    .body-view blockquote {
      margin: 0 0 0 8px;
      padding-left: 10px;
      border-left: 3px solid var(--border);
      color: var(--text-muted);
    }

    /* === Footer / Send split button === */
    .compose-footer {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .send-group {
      display: flex;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .send-main,
    .send-toggle {
      background-color: var(--primary);
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.25s ease;
    }

    .send-main {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
    }

    .send-toggle {
      padding: 10px 12px;
      border-left: 1px solid rgba(255,255,255,0.3);
      font-size: 11px;
    }

    .send-main:hover,
    .send-toggle:hover { background-color: var(--primary-hover); }

    .provider-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #fff;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* === Drawer === */
    .drawer {
      position: absolute;
      bottom: calc(100% - 4px);
      left: 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      padding: 6px;
      min-width: 220px;
      max-height: 260px;
      overflow-y: auto;
      z-index: 10;
    }

    .drawer.hidden { display: none; }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      background: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-dark);
      text-align: left;
    }

    .drawer-item:hover { background: #F1F4FB; }
    .drawer-item .default-tag {
      margin-left: auto;
      font-size: 10px;
      color: var(--text-muted);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: var(--radius);
      padding: 8px 14px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-outline:hover { background: rgba(91,77,181,0.1); }

    .footer-note {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="compose">
    <div class="compose-header">
      <span>New Message</span>
      <span class="badge">Preview only — nothing is sent</span>
    </div>

    <div class="fields">
      <div class="field" id="field-to">
        <span class="field-label">To</span>
        <div class="field-value" id="value-to"></div>
      </div>
      <div class="field hidden" id="field-cc">
        <span class="field-label">Cc</span>
        <div class="field-value" id="value-cc"></div>
      </div>
      <div class="field hidden" id="field-bcc">
        <span class="field-label">Bcc</span>
        <div class="field-value" id="value-bcc"></div>
      </div>
      <div class="field">
        <span class="field-label">Subject</span>
        <div class="field-value subject" id="value-subject"></div>
      </div>
    </div>

    <div class="body-view plain" id="body"></div>

    <div class="compose-footer">
      <div class="drawer hidden" id="drawer"></div>
      <div class="send-group">
        <button class="send-main" id="sendMain">
          <img class="provider-icon" id="providerIcon" alt="" hidden />
          <span id="sendLabel">Send</span>
        </button>
        <button class="send-toggle" id="sendToggle" title="Choose a webmail client">&#9660;</button>
      </div>
      <button class="btn-outline" id="closeBtn">Close</button>
      <span class="footer-note" id="footerNote"></span>
    </div>
  </div>

  <script type="module" src="preview.js"></script>
</body>
</html>
