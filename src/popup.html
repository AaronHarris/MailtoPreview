<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MailToWith</title>
  <link rel="icon" href="../assets/icon48.png" />

  <style>
    /* === CSS Variables === */
    :root {
      --background: #E7F0FF;
      --primary: #5B4DB5;
      --primary-hover: #49379B;
      --text-dark: #333333;
      --text-muted: #6C6C80;
      --radius: 10px;
      --font: 'JetBrains Mono', 'Inter', sans-serif;
      --shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* === Base Layout === */
    body {
      background-color: var(--background);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      width: 300px;
      height: 100%;
      font-family: var(--font);
      color: var(--text-dark);
      text-align: center;
    }

    /* === Container === */
    .popup-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
    }

    /* === Logo and Title === */
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 10px;
      filter: drop-shadow(var(--shadow));
      background: url("../assets/Letter.svg") no-repeat center;
      background-size: contain;
    }

    h2 {
      margin: 4px 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .subtitle {
      margin: 0 0 20px 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* === Labels and Inputs === */
    .label {
      font-size: 13px;
      margin-bottom: 4px;
      text-align: left;
      width: 100%;
    }

    .dropdown {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: var(--radius);
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      font-size: 13px;
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    /* === Buttons === */
    button {
      display: block;
      width: 100%;
      padding: 10px 16px;
      margin-top: 10px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: background-color 0.25s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      box-shadow: none;
    }

    .btn-outline:hover {
      background-color: rgba(91,77,181,0.1);
    }

    /* === Status Message === */
    .status {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      min-height: 16px;
    }

    /* === Footer === */
    footer {
      margin-top: 16px;
      width: 100%;
    }

    .link-btn {
      background: none;
      color: var(--primary);
      border: none;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      box-shadow: none;
    }

    .link-btn:hover {
      color: var(--primary-hover);
    }

    /* === Control Panel Section === */
    .control-panel {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      font-size: 13px;
    }

    .control-panel h4 {
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    /* === Parsed Output === */
    .parsed-output {
      font-family: var(--font);
      background: #fff;
      color: var(--text-dark);
      border-radius: var(--radius);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 10px;
      text-align: left;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 12px;
    }

    .parsed-output.hidden {
      display: none;
    }

    hr {
      width: 100%;
      border: 0;
      border-top: 1px solid #ccc;
      margin: 12px 0;
    }
  </style>
</head>

<body>
  <div class="popup-container">
    <img src="../assets/icon128.png" alt="MailToWith Icon" class="logo" />
    <h2>MailToWith</h2>
    <p class="subtitle">MailTo Links PowerUp</p>
    
    <label for="provider" class="label">Default Mail Client</label>
    <select id="provider" class="dropdown">
      <option value="gmail">Gmail</option>
      <option value="outlook">Outlook.com</option>
      <option value="yahoo">Yahoo Mail</option>
      <option value="protonmail">ProtonMail</option>
    </select>
    <button id="openOptions" class="btn-outline">Email Profiles</button>

    <p id="status" class="status"></p>
    
    <footer>
      <p>MailToWith v1.2.1</p>Coded with ❤️ by Zaldor & The Bots
      <a href="https://github.com/Zaldor/MailToWith" target="_blank" rel="noopener noreferrer">Github  </a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
